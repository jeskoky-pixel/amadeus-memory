name: Release readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dsh-mneme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: dsh-mneme/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run sync
      - run: npm test
      - run: npm run verify:release
      - name: Pack prebuilt candidate
        shell: pwsh
        run: |
          npm pack --ignore-scripts --pack-destination $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter '*.tgz' | Select-Object -First 1
          if (-not $archive) { throw 'No package archive produced' }
          $sha = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "Package: $($archive.Name); SHA-256: $sha" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-memory-candidate
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
